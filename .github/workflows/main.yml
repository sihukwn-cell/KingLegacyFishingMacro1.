name: Build KingPiece APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          
        
        

      - name: Extract project
        run: unzip -q KingPieceFishing_AndroidStudio_Project_v0.2.zip -d project

      - name: Build APK
        working-directory: project/KingPieceFishingAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KingPiece-APK
          path: project/KingPieceFishingAndroid/app/build/outputs/apk/debug/app-debug.apk
